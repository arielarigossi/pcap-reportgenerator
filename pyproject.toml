[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pcap-reportgenerator"
version = "1.0.0"
description = "PCAP network capture analyzer with HTML/CSV report generation"
readme = "Readme.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "PyQt5>=5.15.9",
    "pandas>=1.5.3",
    "matplotlib>=3.7.1",
    "scapy>=2.4.5",
]

[project.scripts]
pcap-report = "pcap_report.app:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["pcap_report*"]
