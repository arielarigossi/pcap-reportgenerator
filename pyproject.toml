[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-reportgenerator"
version = "2.0.0"
description = "PCAP network capture analyzer with a tabbed GUI, display filters and HTML/CSV reports"
readme = "Readme.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "PyQt5>=5.15.9",
    "matplotlib>=3.7.1",
    "scapy>=2.5.0",
]

[project.scripts]
pcap-report = "pcap_report.app:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["pcap_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
